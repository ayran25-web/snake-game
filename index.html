<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake Arcade</title>
    <!-- Tailwind CSS för modern och snabb styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome för ikoner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0f18;
            color: #f1f5f9;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-arcade {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.2);
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.7);
        }

        .neon-text-pink {
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.7);
        }

        .btn-arcade {
            transition: all 0.15s ease-in-out;
        }

        .btn-touch {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        .btn-touch:active {
            transform: scale(0.90);
            background-color: rgba(6, 182, 212, 0.3) !important;
        }

        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-2 px-2 select-none">

    <!-- Huvudbehållare -->
    <div class="w-full max-w-4xl flex flex-col items-center">
        
        <!-- Titel & Header -->
        <header class="text-center mb-1">
            <h1 class="text-2xl sm:text-5xl font-extrabold font-arcade text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500 tracking-wider neon-text-cyan">
                NEON SNAKE
            </h1>
            <p class="text-[10px] sm:text-sm text-slate-400">
                Styr med <span class="text-cyan-400 font-bold">Pilknappar / Svip</span>
            </p>
        </header>

        <!-- Poäng & Statuspanel -->
        <div class="w-full max-w-[280px] sm:max-w-md bg-slate-900/90 border border-slate-700/60 rounded-xl px-3 py-1.5 mb-1.5 flex justify-between items-center shadow-lg backdrop-blur-md">
            <div class="flex flex-col items-start">
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Poäng</span>
                <span id="score" class="text-lg sm:text-3xl font-arcade font-bold text-cyan-400 neon-text-cyan">0</span>
            </div>

            <div id="bonus-timer-container" class="hidden flex flex-col items-center">
                <span class="text-[9px] text-yellow-400 font-bold uppercase animate-pulse">GULDBONUS!</span>
                <div class="w-14 bg-slate-800 h-1.5 rounded-full overflow-hidden mt-0.5 border border-yellow-500/40">
                    <div id="bonus-timer-bar" class="bg-yellow-400 h-full w-full transition-all duration-100"></div>
                </div>
            </div>

            <div class="flex flex-col items-end">
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Rekord</span>
                <span id="high-score" class="text-lg sm:text-3xl font-arcade font-bold text-pink-500 neon-text-pink">0</span>
            </div>
        </div>

        <!-- Spelyta med Canvas & Overlay -->
        <div class="relative w-[280px] h-[280px] sm:w-[400px] sm:h-[400px] bg-slate-950 rounded-2xl overflow-hidden border-2 border-cyan-500/50 neon-glow-cyan shadow-2xl flex items-center justify-center" id="touch-area">
            
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Meny & Pause/Game Over Overlay -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-3 text-center z-10 transition-all duration-300">
                <div id="overlay-title" class="text-xl sm:text-4xl font-arcade font-black text-cyan-400 mb-1 neon-text-cyan">
                    KLAR ATT SPELA?
                </div>
                <p id="overlay-desc" class="text-slate-300 text-[11px] sm:text-sm mb-2.5 max-w-xs">
                    Åk igenom väggarna, samla mat och undvik din svans!
                </p>

                <div class="w-full max-w-xs mb-2.5 space-y-1">
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Svårighetsgrad</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="setSpeed('easy')" id="speed-easy" class="speed-btn px-2 py-1 rounded-lg border border-slate-700 bg-slate-800 text-[11px] font-bold text-slate-300 transition">Lätt</button>
                        <button onclick="setSpeed('medium')" id="speed-medium" class="speed-btn px-2 py-1 rounded-lg border border-cyan-500 bg-cyan-950/50 text-[11px] font-bold text-cyan-400 transition">Medium</button>
                        <button onclick="setSpeed('hard')" id="speed-hard" class="speed-btn px-2 py-1 rounded-lg border border-slate-700 bg-slate-800 text-[11px] font-bold text-slate-300 transition">Blixt</button>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <span class="text-[11px] text-slate-300 font-semibold">Aktivera Hinder</span>
                        <input type="checkbox" id="toggle-obstacles" class="w-4 h-4 accent-pink-500 rounded cursor-pointer" onchange="toggleObstaclesSetting(this.checked)">
                    </div>
                </div>

                <button id="start-btn" onclick="startGame()" class="btn-arcade w-full max-w-xs py-2 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-arcade font-bold text-sm sm:text-base rounded-xl shadow-lg border border-cyan-300 cursor-pointer">
                    STARTA SPELET
                </button>
            </div>
        </div>

        <!-- Paus/Ljud & Mobilkontroller -->
        <div class="w-full max-w-[280px] sm:max-w-md mt-1.5 flex flex-col items-center gap-1">
            
            <div class="flex gap-2 w-full justify-center">
                <button onclick="togglePause()" class="btn-arcade flex-1 py-1 px-3 bg-slate-800 border border-slate-700 rounded-xl font-semibold text-[11px] text-slate-200 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-pause text-cyan-400 pointer-events-none"></i> Paus
                </button>
                <button id="sound-btn" onclick="toggleMute()" class="btn-arcade py-1 px-3 bg-slate-800 border border-slate-700 rounded-xl font-semibold text-[11px] text-slate-200 flex items-center justify-center gap-1.5">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-pink-400 pointer-events-none"></i>
                </button>
            </div>

            <!-- Mobilknappar (D-Pad) -->
            <div class="grid grid-cols-3 gap-1 w-44 h-24">
                <div></div>
                <button id="btn-up" class="btn-touch bg-slate-800/90 border border-cyan-500/60 rounded-xl flex items-center justify-center text-lg text-cyan-400 shadow">
                    <i class="fa-solid fa-chevron-up pointer-events-none"></i>
                </button>
                <div></div>
                
                <button id="btn-left" class="btn-touch bg-slate-800/90 border border-cyan-500/60 rounded-xl flex items-center justify-center text-lg text-cyan-400 shadow">
                    <i class="fa-solid fa-chevron-left pointer-events-none"></i>
                </button>
                <button id="btn-down" class="btn-touch bg-slate-800/90 border border-cyan-500/60 rounded-xl flex items-center justify-center text-lg text-cyan-400 shadow">
                    <i class="fa-solid fa-chevron-down pointer-events-none"></i>
                </button>
                <button id="btn-right" class="btn-touch bg-slate-800/90 border border-cyan-500/60 rounded-xl flex items-center justify-center text-lg text-cyan-400 shadow">
                    <i class="fa-solid fa-chevron-right pointer-events-none"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- SPEL-LOGIK -->
    <script>
        const GRID_SIZE = 20;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_SIZE = 400;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;

        let snake = [];
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let food = { x: 0, y: 0 };
        let bonusFood = null;
        let obstacles = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('neon_snake_highscore')) || 0;
        let gameInterval = null;
        let isPaused = false;
        let isGameOver = false;
        let gameSpeed = 95;
        let enableObstacles = false;
        let isMuted = false;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'bonus') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.06);
                osc.frequency.setValueAtTime(783.99, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const soundIcon = document.getElementById('sound-icon');
            soundIcon.className = isMuted ? 'fa-solid fa-volume-xmark text-slate-500 pointer-events-none' : 'fa-solid fa-volume-high text-pink-400 pointer-events-none';
        }

        document.getElementById('high-score').textContent = highScore;

        function setSpeed(speed) {
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.className = 'speed-btn px-2 py-1 rounded-lg border border-slate-700 bg-slate-800 text-[11px] font-bold text-slate-300 transition';
            });
            const activeBtn = document.getElementById(`speed-${speed}`);
            activeBtn.className = 'speed-btn px-2 py-1 rounded-lg border border-cyan-500 bg-cyan-950/50 text-[11px] font-bold text-cyan-400 transition';

            if (speed === 'easy') gameSpeed = 130;
            if (speed === 'medium') gameSpeed = 95;
            if (speed === 'hard') gameSpeed = 65;
        }

        function toggleObstaclesSetting(checked) {
            enableObstacles = checked;
        }

        function startGame() {
            initAudio();
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            isPaused = false;
            isGameOver = false;
            bonusFood = null;
            document.getElementById('score').textContent = '0';
            document.getElementById('bonus-timer-container').classList.add('hidden');

            generateObstacles();
            spawnFood();
            document.getElementById('overlay').classList.add('hidden');

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function generateObstacles() {
            obstacles = [];
            if (!enableObstacles) return;
            const obstacleCount = 6;
            for (let i = 0; i < obstacleCount; i++) {
                let obsX, obsY;
                do {
                    obsX = Math.floor(Math.random() * GRID_SIZE);
                    obsY = Math.floor(Math.random() * GRID_SIZE);
                } while (obsX >= 5 && obsX <= 12 && obsY >= 8 && obsY <= 12);
                obstacles.push({ x: obsX, y: obsY });
            }
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(s => s.x === food.x && s.y === food.y) &&
                        !obstacles.some(o => o.x === food.x && o.y === food.y);
            }
            if (!bonusFood && Math.random() < 0.25) spawnBonusFood();
        }

        function spawnBonusFood() {
            let valid = false;
            let bx, by;
            while (!valid) {
                bx = Math.floor(Math.random() * GRID_SIZE);
                by = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(s => s.x === bx && s.y === by) &&
                        !obstacles.some(o => o.x === bx && o.y === by) &&
                        (bx !== food.x || by !== food.y);
            }
            bonusFood = { x: bx, y: by, timer: 40, maxTimer: 40 };
            document.getElementById('bonus-timer-container').classList.remove('hidden');
        }

        function gameLoop() {
            if (isPaused || isGameOver) return;

            direction = nextDirection;
            const head = { ...snake[0] };

            if (direction === 'UP') head.y--;
            if (direction === 'DOWN') head.y++;
            if (direction === 'LEFT') head.x--;
            if (direction === 'RIGHT') head.x++;

            // Tunnel-effekt
            if (head.x < 0) head.x = GRID_SIZE - 1;
            if (head.x >= GRID_SIZE) head.x = 0;
            if (head.y < 0) head.y = GRID_SIZE - 1;
            if (head.y >= GRID_SIZE) head.y = 0;

            if (snake.some(s => s.x === head.x && s.y === head.y) ||
                obstacles.some(o => o.x === head.x && o.y === head.y)) {
                return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                playSound('eat');
                spawnFood();
            } else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
                score += 30;
                document.getElementById('score').textContent = score;
                playSound('bonus');
                bonusFood = null;
                document.getElementById('bonus-timer-container').classList.add('hidden');
            } else {
                snake.pop();
            }

            if (bonusFood) {
                bonusFood.timer--;
                const percent = (bonusFood.timer / bonusFood.maxTimer) * 100;
                document.getElementById('bonus-timer-bar').style.width = `${percent}%`;
                if (bonusFood.timer <= 0) {
                    bonusFood = null;
                    document.getElementById('bonus-timer-container').classList.add('hidden');
                }
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }

            obstacles.forEach(obs => {
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 8;
                ctx.fillRect(obs.x * CELL_SIZE + 2, obs.y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                ctx.shadowBlur = 0;
            });

            ctx.fillStyle = '#22d3ee';
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE / 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (bonusFood) {
                ctx.fillStyle = '#facc15';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 15;
                ctx.fillRect(bonusFood.x * CELL_SIZE + 3, bonusFood.y * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6);
                ctx.shadowBlur = 0;
            }

            snake.forEach((segment, index) => {
                const isHead = index === 0;
                if (isHead) {
                    ctx.fillStyle = '#ec4899';
                    ctx.shadowColor = '#ec4899';
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = `hsl(${180 + (index * 4) % 60}, 100%, 50%)`;
                    ctx.shadowBlur = 0;
                }

                const radius = isHead ? 6 : 4;
                const x = segment.x * CELL_SIZE + 1;
                const y = segment.y * CELL_SIZE + 1;
                const w = CELL_SIZE - 2;
                const h = CELL_SIZE - 2;

                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            playSound('gameover');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_snake_highscore', highScore);
                document.getElementById('high-score').textContent = highScore;
            }

            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-title').textContent = 'GAME OVER';
            document.getElementById('overlay-title').className = 'text-xl sm:text-4xl font-arcade font-black text-pink-500 mb-1 neon-text-pink';
            document.getElementById('overlay-desc').textContent = `Du fick ${score} poäng!`;
            document.getElementById('start-btn').textContent = 'SPELA IGEN';
            overlay.classList.remove('hidden');
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;

            const overlay = document.getElementById('overlay');
            if (isPaused) {
                document.getElementById('overlay-title').textContent = 'PAUSAT';
                document.getElementById('overlay-title').className = 'text-xl sm:text-4xl font-arcade font-black text-cyan-400 mb-1 neon-text-cyan';
                document.getElementById('overlay-desc').textContent = 'Klicka nedan för att fortsätta.';
                document.getElementById('start-btn').textContent = 'FORTSÄTT';
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            if (e.key === ' ' || e.code === 'Space') {
                if (isGameOver) startGame(); else togglePause();
                return;
            }
            if (isPaused || isGameOver) return;

            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && direction !== 'DOWN') nextDirection = 'UP';
            if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && direction !== 'UP') nextDirection = 'DOWN';
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && direction !== 'RIGHT') nextDirection = 'LEFT';
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && direction !== 'LEFT') nextDirection = 'RIGHT';
        });

        function changeDir(dir) {
            initAudio();
            if (navigator.vibrate) navigator.vibrate(10);
            if (isPaused || isGameOver) return;
            if (dir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
            if (dir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
            if (dir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
            if (dir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
        }

        const bindBtn = (id, dir) => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    changeDir(dir);
                });
            }
        };

        bindBtn('btn-up', 'UP');
        bindBtn('btn-down', 'DOWN');
        bindBtn('btn-left', 'LEFT');
        bindBtn('btn-right', 'RIGHT');

        let touchStartX = 0;
        let touchStartY = 0;
        const touchArea = document.getElementById('touch-area');

        touchArea.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        touchArea.addEventListener('touchend', e => {
            if (isPaused || isGameOver) return;
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 20) changeDir(diffX > 0 ? 'RIGHT' : 'LEFT');
            } else {
                if (Math.abs(diffY) > 20) changeDir(diffY > 0 ? 'DOWN' : 'UP');
            }
        }, { passive: true });

        draw();
    </script>
</body>
</html>

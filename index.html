<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temple Relic Runner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #120e0a;
            color: #f1f5f9;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-temple {
            font-family: 'Cinzel', serif;
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.3), inset 0 0 10px rgba(234, 179, 8, 0.1);
        }

        .gold-text {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.6);
        }

        .btn-arcade {
            transition: all 0.15s ease-in-out;
        }

        .btn-arcade:active {
            transform: scale(0.95);
        }

        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-2 px-2 select-none">

    <!-- Huvudbehållare -->
    <div class="w-full max-w-lg flex flex-col items-center">
        
        <!-- Header -->
        <header class="w-full flex justify-between items-center mb-2 px-1">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold font-temple text-amber-400 tracking-wider gold-text">
                    TEMPLE RELIC RUNNER
                </h1>
                <p class="text-[10px] sm:text-xs text-amber-200/60">
                    Tryck <span class="text-amber-400 font-bold">Överst</span> för Hopp | <span class="text-amber-400 font-bold">Nederst</span> för Glid
                </p>
            </div>
            <button id="sound-btn" onclick="toggleMute()" class="btn-arcade py-1.5 px-3 bg-amber-950/80 border border-amber-600/50 rounded-xl text-xs text-amber-200 flex items-center gap-1.5 shadow">
                <i id="sound-icon" class="fa-solid fa-volume-high text-amber-400 pointer-events-none"></i>
            </button>
        </header>

        <!-- Poäng & Skatter Statuspanel -->
        <div class="w-full bg-stone-900/90 border border-amber-900/40 rounded-xl px-4 py-2 mb-2 flex justify-between items-center shadow-lg backdrop-blur-md">
            <div class="flex flex-col items-start">
                <span class="text-[9px] text-amber-500/80 font-semibold uppercase tracking-wider">Distans</span>
                <span id="score" class="text-xl sm:text-2xl font-temple font-bold text-amber-300">0m</span>
            </div>

            <div class="flex flex-col items-center">
                <span class="text-[9px] text-amber-500/80 font-semibold uppercase tracking-wider">Skatter</span>
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-gem text-amber-400 text-xs"></i>
                    <span id="treasures" class="text-xl sm:text-2xl font-temple font-bold text-amber-400 gold-text">0</span>
                </div>
            </div>

            <div class="flex flex-col items-end">
                <span class="text-[9px] text-amber-500/80 font-semibold uppercase tracking-wider">Rekord</span>
                <span id="high-score" class="text-xl sm:text-2xl font-temple font-bold text-amber-500">0m</span>
            </div>
        </div>

        <!-- Spelyta Canvas -->
        <div id="game-container" class="relative w-full aspect-[4/3] bg-stone-950 rounded-2xl overflow-hidden border-2 border-amber-600/40 gold-glow shadow-2xl flex items-center justify-center cursor-pointer">
            
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Start / Game Over Overlay -->
            <div id="overlay" class="absolute inset-0 bg-stone-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-10 transition-all duration-300">
                <div id="overlay-title" class="text-2xl sm:text-4xl font-temple font-black text-amber-400 mb-2 gold-text">
                    TEMPLE RELIC RUNNER
                </div>
                <p id="overlay-desc" class="text-amber-200/80 text-xs sm:text-sm mb-4 max-w-xs leading-relaxed">
                    Fly ur det rasande templet! Hoppa över spikar och glid under stenväggarna.
                </p>

                <button id="start-btn" onclick="startGame()" class="btn-arcade w-full max-w-xs py-3 px-6 bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-stone-950 font-temple font-black text-base rounded-xl shadow-lg border border-amber-300 cursor-pointer tracking-wider">
                    BÖRJA ÄVENTYRET
                </button>
            </div>
        </div>

    </div>

    <!-- SPEL-LOGIK -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 450;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const GROUND_Y = 370;
        const PLAYER_WIDTH = 26;
        const PLAYER_NORMAL_HEIGHT = 44;
        const PLAYER_SLIDE_HEIGHT = 22;

        let isRunning = false;
        let isGameOver = false;
        let score = 0;
        let treasures = parseInt(localStorage.getItem('tr_treasures')) || 0;
        let highScore = parseInt(localStorage.getItem('tr_highscore')) || 0;
        let gameSpeed = 5.5;
        let isMuted = false;

        // Spelaren (Äventyraren)
        let player = {
            x: 90,
            y: GROUND_Y - PLAYER_NORMAL_HEIGHT,
            vy: 0,
            width: PLAYER_WIDTH,
            height: PLAYER_NORMAL_HEIGHT,
            isJumping: false,
            isSliding: false,
            slideTimer: 0
        };

        // Hinder och skatter
        let obstacles = [];
        let relics = [];
        let particles = [];
        let spawnTimer = 0;

        document.getElementById('high-score').textContent = `${highScore}m`;
        document.getElementById('treasures').textContent = treasures;

        // Ljudsystem (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'slide') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'relic') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(580, now);
                osc.frequency.setValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('sound-icon').className = isMuted 
                ? 'fa-solid fa-volume-xmark text-amber-700 pointer-events-none' 
                : 'fa-solid fa-volume-high text-amber-400 pointer-events-none';
        }

        function playerJump() {
            if (!isRunning || isGameOver) return;
            if (!player.isJumping && !player.isSliding) {
                player.vy = -11.5;
                player.isJumping = true;
                player.isSliding = false;
                player.height = PLAYER_NORMAL_HEIGHT;
                playSound('jump');
            }
        }

        function playerSlide() {
            if (!isRunning || isGameOver) return;
            if (!player.isJumping) {
                player.isSliding = true;
                player.height = PLAYER_SLIDE_HEIGHT;
                player.y = GROUND_Y - PLAYER_SLIDE_HEIGHT;
                player.slideTimer = 35; // Antal frames man glider
                playSound('slide');
            }
        }

        function startGame() {
            initAudio();
            isRunning = true;
            isGameOver = false;
            score = 0;
            gameSpeed = 5.5;
            obstacles = [];
            relics = [];
            particles = [];
            spawnTimer = 0;

            player.y = GROUND_Y - PLAYER_NORMAL_HEIGHT;
            player.vy = 0;
            player.isJumping = false;
            player.isSliding = false;
            player.height = PLAYER_NORMAL_HEIGHT;

            document.getElementById('score').textContent = '0m';
            document.getElementById('overlay').classList.add('hidden');

            requestAnimationFrame(gameLoop);
        }

        function spawnObstacleOrRelic() {
            spawnTimer++;
            if (spawnTimer > Math.max(40, 75 - Math.floor(score / 40))) {
                spawnTimer = 0;

                const type = Math.random();

                if (type < 0.55) {
                    // Markhinder (Spikar / Stenblock att hoppa över)
                    obstacles.push({
                        x: CANVAS_WIDTH + 30,
                        y: GROUND_Y - 32,
                        w: 30,
                        h: 32,
                        type: 'spike'
                    });
                } else if (type < 0.8) {
                    // Högt hinder (Stenvägg att glida under)
                    obstacles.push({
                        x: CANVAS_WIDTH + 30,
                        y: GROUND_Y - 75,
                        w: 35,
                        h: 45,
                        type: 'wall'
                    });
                } else {
                    // Skatt / Relik att plocka
                    const high = Math.random() < 0.5;
                    relics.push({
                        x: CANVAS_WIDTH + 30,
                        y: high ? GROUND_Y - 80 : GROUND_Y - 35,
                        size: 18
                    });
                }
            }
        }

        function update() {
            if (!isRunning || isGameOver) return;

            score += 0.25;
            document.getElementById('score').textContent = `${Math.floor(score)}m`;

            // Gradvis fartökning
            if (gameSpeed < 12) gameSpeed += 0.0015;

            // Fysik för hopp
            if (player.isJumping) {
                player.y += player.vy;
                player.vy += 0.65; // Gravitation

                // Landning på marken
                if (player.y >= GROUND_Y - PLAYER_NORMAL_HEIGHT) {
                    player.y = GROUND_Y - PLAYER_NORMAL_HEIGHT;
                    player.isJumping = false;
                    player.vy = 0;
                }
            }

            // Timer för glidning
            if (player.isSliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) {
                    player.isSliding = false;
                    player.height = PLAYER_NORMAL_HEIGHT;
                    player.y = GROUND_Y - PLAYER_NORMAL_HEIGHT;
                }
            }

            spawnObstacleOrRelic();

            // Uppdatera Hinder
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // AABB Kollisionskontroll
                if (
                    player.x < obs.x + obs.w - 4 &&
                    player.x + player.width > obs.x + 4 &&
                    player.y < obs.y + obs.h - 4 &&
                    player.y + player.height > obs.y + 4
                ) {
                    gameOver();
                    return;
                }

                if (obs.x + obs.w < -30) obstacles.splice(i, 1);
            }

            // Uppdatera Skatter/Reliker
            for (let i = relics.length - 1; i >= 0; i--) {
                let relic = relics[i];
                relic.x -= gameSpeed;

                if (
                    player.x < relic.x + relic.size &&
                    player.x + player.width > relic.x &&
                    player.y < relic.y + relic.size &&
                    player.y + player.height > relic.y
                ) {
                    treasures += 1;
                    localStorage.setItem('tr_treasures', treasures);
                    document.getElementById('treasures').textContent = treasures;
                    playSound('relic');

                    // Guldpartiklar
                    for (let j = 0; j < 6; j++) {
                        particles.push({
                            x: relic.x,
                            y: relic.y,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4,
                            size: 3,
                            color: '#eab308',
                            life: 1
                        });
                    }

                    relics.splice(i, 1);
                } else if (relic.x < -30) {
                    relics.splice(i, 1);
                }
            }

            // Uppdatera partiklar
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Bakgrund (Stenmur med facklor)
            ctx.fillStyle = '#1c140f';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Tempel-pelare / bakgrundsdetaljer i parallax
            ctx.fillStyle = '#291e17';
            let bgOffset = (score * 2) % 100;
            for (let i = -1; i < CANVAS_WIDTH / 100 + 2; i++) {
                let x = i * 100 - bgOffset;
                ctx.fillRect(x, 50, 40, GROUND_Y - 50);
            }

            // Stengolv
            ctx.fillStyle = '#3a2d24';
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#eab308';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Rita partiklar
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;

            // Rita Spelaren (Äventyraren med hatt)
            ctx.fillStyle = '#d97706'; // Jacka/Tröja
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Ansikte / Hatt
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(player.x + 4, player.y + 4, player.width - 8, 12);

            // Rita Hinder
            obstacles.forEach(obs => {
                if (obs.type === 'spike') {
                    // Spikar på marken
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w / 2, obs.y);
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    // Stenvägg / Block att glida under
                    ctx.fillStyle = '#78716c';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = '#44403c';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                }
            });

            // Rita Skatter / Reliker (Gyllene diamant)
            relics.forEach(relic => {
                ctx.fillStyle = '#eab308';
                ctx.shadowColor = '#eab308';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(relic.x + relic.size / 2, relic.y);
                ctx.lineTo(relic.x + relic.size, relic.y + relic.size / 2);
                ctx.lineTo(relic.x + relic.size / 2, relic.y + relic.size);
                ctx.lineTo(relic.x, relic.y + relic.size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function gameOver() {
            isGameOver = true;
            isRunning = false;
            playSound('hit');

            const finalScore = Math.floor(score);
            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem('tr_highscore', highScore);
                document.getElementById('high-score').textContent = `${highScore}m`;
            }

            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-title').textContent = 'FÅNGAD AV TEMplet!';
            document.getElementById('overlay-title').className = 'text-2xl sm:text-4xl font-temple font-black text-rose-500 mb-2';
            document.getElementById('overlay-desc').textContent = `Du flydde ${finalScore} meter och räddade ${treasures} skatter!`;
            document.getElementById('start-btn').textContent = 'FÖRSÖK IGEN';
            overlay.classList.remove('hidden');
        }

        function gameLoop() {
            update();
            draw();
            if (isRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Touch & Klick-kontroller (Översta halvan = hopp, Nedersta halvan = glid)
        const gameContainer = document.getElementById('game-container');
        gameContainer.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isRunning || isGameOver) return;

            const rect = gameContainer.getBoundingClientRect();
            const clickY = e.clientY - rect.top;

            if (clickY < rect.height / 2) {
                playerJump();
            } else {
                playerSlide();
            }
        });

        // Tangentbordskontroller för dator (Mellanslag/Pil upp = Hopp, Pil ner = Glid)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                playerJump();
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                playerSlide();
            }
        });

        // Rita första bildrutan
        draw();
    </script>
</body>
</html>

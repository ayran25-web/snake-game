<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temple Explorer - Animated Runner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c100d;
            color: #f1f5f9;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-temple {
            font-family: 'Cinzel', serif;
        }

        .jungle-glow {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.25), inset 0 0 15px rgba(34, 197, 94, 0.1);
        }

        .btn-arcade {
            transition: all 0.1s ease-in-out;
        }

        .btn-arcade:active {
            transform: scale(0.92);
        }

        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-2 px-2 select-none">

    <!-- Huvudbehållare -->
    <div class="w-full max-w-md flex flex-col items-center">
        
        <!-- Header -->
        <header class="w-full flex justify-between items-center mb-2 px-1">
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold font-temple text-emerald-400 tracking-wider">
                    TEMPLE EXPLORER
                </h1>
                <p class="text-[10px] sm:text-xs text-slate-400">
                    Fly undan djungeltemplet!
                </p>
            </div>
            <button id="sound-btn" onclick="toggleMute()" class="btn-arcade py-1.5 px-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 flex items-center gap-1.5 shadow">
                <i id="sound-icon" class="fa-solid fa-volume-high text-emerald-400 pointer-events-none"></i>
            </button>
        </header>

        <!-- Poäng & Skatter Statuspanel -->
        <div class="w-full bg-slate-900/90 border border-emerald-900/40 rounded-xl px-4 py-2 mb-2 flex justify-between items-center shadow-lg backdrop-blur-md">
            <div class="flex flex-col items-start">
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Distans</span>
                <span id="score" class="text-lg sm:text-2xl font-temple font-bold text-emerald-300">0m</span>
            </div>

            <div class="flex flex-col items-center">
                <span class="text-[9px] text-amber-400 font-semibold uppercase tracking-wider">Reliker</span>
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-gem text-amber-400 text-xs"></i>
                    <span id="treasures" class="text-lg sm:text-2xl font-temple font-bold text-amber-400">0</span>
                </div>
            </div>

            <div class="flex flex-col items-end">
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Rekord</span>
                <span id="high-score" class="text-lg sm:text-2xl font-temple font-bold text-emerald-500">0m</span>
            </div>
        </div>

        <!-- Spelyta Canvas -->
        <div class="relative w-full aspect-[4/3] bg-slate-950 rounded-2xl overflow-hidden border-2 border-emerald-600/40 jungle-glow shadow-2xl flex items-center justify-center">
            
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Start / Game Over Overlay -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-10 transition-all duration-300">
                <div id="overlay-title" class="text-2xl sm:text-3xl font-temple font-black text-emerald-400 mb-2">
                    TEMPLE EXPLORER
                </div>
                <p id="overlay-desc" class="text-slate-300 text-xs sm:text-sm mb-4 max-w-xs leading-relaxed">
                    Hoppa över fällor och glid under grenar. Använd knapparna nedanför!
                </p>

                <button id="start-btn" onclick="startGame()" class="btn-arcade w-full max-w-xs py-3 px-6 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-slate-950 font-temple font-black text-sm sm:text-base rounded-xl shadow-lg border border-emerald-300 cursor-pointer tracking-wider">
                    STARTA ÄVENTYRET
                </button>
            </div>
        </div>

        <!-- Stora Tydliga Kontrollknappar för Mobil -->
        <div class="w-full grid grid-cols-2 gap-2 mt-3">
            <button onclick="playerJump()" class="btn-arcade py-3.5 bg-slate-800 border border-emerald-500/50 hover:bg-slate-700 active:bg-emerald-900/50 text-emerald-300 font-temple font-bold text-base rounded-xl shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-up text-emerald-400"></i> HOPPA
            </button>
            <button onclick="playerSlide()" class="btn-arcade py-3.5 bg-slate-800 border border-amber-500/50 hover:bg-slate-700 active:bg-amber-900/50 text-amber-300 font-temple font-bold text-base rounded-xl shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-down text-amber-400"></i> GLIDA
            </button>
        </div>

    </div>

    <!-- SPEL-LOGIK -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 450;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const GROUND_Y = 370;
        const PLAYER_X = 90;
        const PLAYER_NORMAL_HEIGHT = 48;
        const PLAYER_SLIDE_HEIGHT = 26;
        const PLAYER_WIDTH = 32;

        let isRunning = false;
        let isGameOver = false;
        let score = 0;
        let treasures = parseInt(localStorage.getItem('te_treasures')) || 0;
        let highScore = parseInt(localStorage.getItem('te_highscore')) || 0;
        let gameSpeed = 5.5;
        let isMuted = false;
        let animFrame = 0;

        // Spelaren (Äventyraren)
        let player = {
            y: GROUND_Y - PLAYER_NORMAL_HEIGHT,
            vy: 0,
            height: PLAYER_NORMAL_HEIGHT,
            isJumping: false,
            isSliding: false,
            slideTimer: 0
        };

        let obstacles = [];
        let relics = [];
        let particles = [];
        let spawnTimer = 0;

        document.getElementById('high-score').textContent = `${highScore}m`;
        document.getElementById('treasures').textContent = treasures;

        // Ljudsystem (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'slide') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'relic') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(950, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('sound-icon').className = isMuted 
                ? 'fa-solid fa-volume-xmark text-slate-500 pointer-events-none' 
                : 'fa-solid fa-volume-high text-emerald-400 pointer-events-none';
        }

        function playerJump() {
            if (!isRunning || isGameOver) return;
            if (!player.isJumping && !player.isSliding) {
                player.vy = -12;
                player.isJumping = true;
                player.isSliding = false;
                player.height = PLAYER_NORMAL_HEIGHT;
                playSound('jump');
            }
        }

        function playerSlide() {
            if (!isRunning || isGameOver) return;
            if (!player.isJumping) {
                player.isSliding = true;
                player.height = PLAYER_SLIDE_HEIGHT;
                player.y = GROUND_Y - PLAYER_SLIDE_HEIGHT;
                player.slideTimer = 35;
                playSound('slide');
            }
        }

        function startGame() {
            initAudio();
            isRunning = true;
            isGameOver = false;
            score = 0;
            gameSpeed = 5.5;
            obstacles = [];
            relics = [];
            particles = [];
            spawnTimer = 0;

            player.y = GROUND_Y - PLAYER_NORMAL_HEIGHT;
            player.vy = 0;
            player.isJumping = false;
            player.isSliding = false;
            player.height = PLAYER_NORMAL_HEIGHT;

            document.getElementById('score').textContent = '0m';
            document.getElementById('overlay').classList.add('hidden');

            requestAnimationFrame(gameLoop);
        }

        function spawnObstacleOrRelic() {
            spawnTimer++;
            if (spawnTimer > Math.max(38, 70 - Math.floor(score / 45))) {
                spawnTimer = 0;
                const type = Math.random();

                if (type < 0.5) {
                    // Djungelspik på marken (hoppa över)
                    obstacles.push({
                        x: CANVAS_WIDTH + 30,
                        y: GROUND_Y - 30,
                        w: 28,
                        h: 30,
                        type: 'spike'
                    });
                } else if (type < 0.75) {
                    // Hängande gren / stenmur (glida under)
                    obstacles.push({
                        x: CANVAS_WIDTH + 30,
                        y: GROUND_Y - 78,
                        w: 36,
                        h: 46,
                        type: 'branch'
                    });
                } else {
                    // Relik att samla
                    const high = Math.random() < 0.5;
                    relics.push({
                        x: CANVAS_WIDTH + 30,
                        y: high ? GROUND_Y - 85 : GROUND_Y - 36,
                        size: 20
                    });
                }
            }
        }

        function update() {
            if (!isRunning || isGameOver) return;

            score += 0.25;
            animFrame += 0.15;
            document.getElementById('score').textContent = `${Math.floor(score)}m`;

            if (gameSpeed < 12.5) gameSpeed += 0.0018;

            // Hopp-fysik
            if (player.isJumping) {
                player.y += player.vy;
                player.vy += 0.68;

                if (player.y >= GROUND_Y - PLAYER_NORMAL_HEIGHT) {
                    player.y = GROUND_Y - PLAYER_NORMAL_HEIGHT;
                    player.isJumping = false;
                    player.vy = 0;
                }
            }

            // Glid-timer
            if (player.isSliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) {
                    player.isSliding = false;
                    player.height = PLAYER_NORMAL_HEIGHT;
                    player.y = GROUND_Y - PLAYER_NORMAL_HEIGHT;
                }
            }

            spawnObstacleOrRelic();

            // Uppdatera hinder
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (
                    PLAYER_X < obs.x + obs.w - 5 &&
                    PLAYER_X + PLAYER_WIDTH > obs.x + 5 &&
                    player.y < obs.y + obs.h - 5 &&
                    player.y + player.height > obs.y + 5
                ) {
                    gameOver();
                    return;
                }

                if (obs.x + obs.w < -30) obstacles.splice(i, 1);
            }

            // Uppdatera reliker
            for (let i = relics.length - 1; i >= 0; i--) {
                let relic = relics[i];
                relic.x -= gameSpeed;

                if (
                    PLAYER_X < relic.x + relic.size &&
                    PLAYER_X + PLAYER_WIDTH > relic.x &&
                    player.y < relic.y + relic.size &&
                    player.y + player.height > relic.y
                ) {
                    treasures += 1;
                    localStorage.setItem('te_treasures', treasures);
                    document.getElementById('treasures').textContent = treasures;
                    playSound('relic');

                    for (let j = 0; j < 6; j++) {
                        particles.push({
                            x: relic.x,
                            y: relic.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            size: 3,
                            color: '#fbbf24',
                            life: 1
                        });
                    }
                    relics.splice(i, 1);
                } else if (relic.x < -30) {
                    relics.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Bakgrund (Djungeltempel i skymning)
            ctx.fillStyle = '#0f1713';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Parallax bakgrundsdetaljer (pelare)
            ctx.fillStyle = '#17221b';
            let bgOffset = (score * 1.5) % 120;
            for (let i = -1; i < CANVAS_WIDTH / 120 + 2; i++) {
                let x = i * 120 - bgOffset;
                ctx.fillRect(x, 60, 50, GROUND_Y - 60);
            }

            // Marknivå
            ctx.fillStyle = '#1e3325';
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#22c55e';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Partiklar
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;

            // RITA KARAKTÄREN (Äventyraren med löpanimation)
            ctx.save();
            ctx.translate(PLAYER_X, player.y);

            if (player.isSliding) {
                // Glidande karaktär
                ctx.fillStyle = '#10b981'; // Jacka
                ctx.fillRect(0, PLAYER_SLIDE_HEIGHT - 16, PLAYER_WIDTH, 16);
                ctx.fillStyle = '#f59e0b'; // Hatt
                ctx.fillRect(PLAYER_WIDTH - 12, PLAYER_SLIDE_HEIGHT - 22, 16, 8);
            } else {
                // Stående / Hoppande karaktär med arm- och benanimation
                let legSwing = Math.sin(animFrame * 2) * 8;
                let armSwing = Math.cos(animFrame * 2) * 8;

                if (player.isJumping) {
                    legSwing = -4;
                    armSwing = -10;
                }

                // Ben 1
                ctx.strokeStyle = '#059669';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(PLAYER_WIDTH / 2, PLAYER_NORMAL_HEIGHT - 16);
                ctx.lineTo(PLAYER_WIDTH / 2 + legSwing, PLAYER_NORMAL_HEIGHT);
                ctx.stroke();

                // Ben 2
                ctx.beginPath();
                ctx.moveTo(PLAYER_WIDTH / 2, PLAYER_NORMAL_HEIGHT - 16);
                ctx.lineTo(PLAYER_WIDTH / 2 - legSwing, PLAYER_NORMAL_HEIGHT);
                ctx.stroke();

                // Torso (Jacka)
                ctx.fillStyle = '#10b981';
                ctx.fillRect(4, 16, PLAYER_WIDTH - 8, 22);

                // Arm 1
                ctx.strokeStyle = '#059669';
                ctx.beginPath();
                ctx.moveTo(PLAYER_WIDTH / 2, 20);
                ctx.lineTo(PLAYER_WIDTH / 2 + armSwing, 32);
                ctx.stroke();

                // Huvud & Hatt
                ctx.fillStyle = '#fde68a'; // Ansikte
                ctx.fillRect(8, 4, 16, 14);

                ctx.fillStyle = '#d97706'; // Hattbrätte
                ctx.fillRect(4, 2, 24, 4);
                ctx.fillStyle = '#b45309'; // Hattkulle
                ctx.fillRect(8, -4, 16, 8);
            }
            ctx.restore();

            // Rita hinder
            obstacles.forEach(obs => {
                if (obs.type === 'spike') {
                    // Djungelspikar
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w / 2, obs.y);
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    // Hängande gren / mur
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = '#334155';
                    ctx.fillRect(obs.x + 4, obs.y + 4, obs.w - 8, obs.h - 8);
                }
            });

            // Rita reliker (Gulddiamanter)
            relics.forEach(relic => {
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(relic.x + relic.size / 2, relic.y);
                ctx.lineTo(relic.x + relic.size, relic.y + relic.size / 2);
                ctx.lineTo(relic.x + relic.size / 2, relic.y + relic.size);
                ctx.lineTo(relic.x, relic.y + relic.size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function gameOver() {
            isGameOver = true;
            isRunning = false;
            playSound('hit');

            const finalScore = Math.floor(score);
            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem('te_highscore', highScore);
                document.getElementById('high-score').textContent = `${highScore}m`;
            }

            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-title').textContent = 'FÅNGAD AV FÄLLAN!';
            document.getElementById('overlay-title').className = 'text-2xl sm:text-3xl font-temple font-black text-rose-500 mb-2';
            document.getElementById('overlay-desc').textContent = `Du sprang ${finalScore} meter och samlade ${treasures} reliker!`;
            document.getElementById('start-btn').textContent = 'FÖRSÖK IGEN';
            overlay.classList.remove('hidden');
        }

        function gameLoop() {
            update();
            draw();
            if (isRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Tangentbordsstöd för dator (Mellanslag/Pil upp = Hopp, Pil ner = Glid)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                playerJump();
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                playerSlide();
            }
        });

        // Rita första bildrutan
        draw();
    </script>
</body>
</html>

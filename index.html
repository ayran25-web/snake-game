<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gravity Thief - Neon Runner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #080911;
            color: #f1f5f9;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-arcade {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.2);
        }

        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }

        .neon-text-gold {
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
        }

        .neon-text-pink {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8);
        }

        .btn-arcade {
            transition: all 0.15s ease-in-out;
        }

        .btn-arcade:active {
            transform: scale(0.95);
        }

        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-2 px-2 select-none">

    <!-- Huvudbehållare -->
    <div class="w-full max-w-lg flex flex-col items-center">
        
        <!-- Header -->
        <header class="w-full flex justify-between items-center mb-2 px-1">
            <div>
                <h1 class="text-2xl sm:text-4xl font-black font-arcade text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 tracking-wider neon-text-cyan">
                    GRAVITY THIEF
                </h1>
                <p class="text-[10px] sm:text-xs text-slate-400">
                    Tryck på skärmen för att <span class="text-cyan-400 font-bold">växla tyngdkraft</span>!
                </p>
            </div>
            <button id="sound-btn" onclick="toggleMute()" class="btn-arcade py-1.5 px-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-slate-200 flex items-center gap-1.5 shadow">
                <i id="sound-icon" class="fa-solid fa-volume-high text-cyan-400 pointer-events-none"></i>
            </button>
        </header>

        <!-- Poäng, Mynt & Rekord -->
        <div class="w-full bg-slate-900/90 border border-slate-700/60 rounded-xl px-4 py-2 mb-2 flex justify-between items-center shadow-lg backdrop-blur-md">
            <div class="flex flex-col items-start">
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Distans</span>
                <span id="score" class="text-xl sm:text-2xl font-arcade font-bold text-cyan-400 neon-text-cyan">0m</span>
            </div>

            <div class="flex flex-col items-center">
                <span class="text-[9px] text-yellow-400 font-semibold uppercase tracking-wider">Skatter</span>
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-gem text-yellow-400 text-xs"></i>
                    <span id="gems" class="text-xl sm:text-2xl font-arcade font-bold text-yellow-400 neon-text-gold">0</span>
                </div>
            </div>

            <div class="flex flex-col items-end">
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider">Rekord</span>
                <span id="high-score" class="text-xl sm:text-2xl font-arcade font-bold text-pink-500 neon-text-pink">0m</span>
            </div>
        </div>

        <!-- Spelyta Canvas -->
        <div id="game-container" class="relative w-full aspect-[4/3] bg-slate-950 rounded-2xl overflow-hidden border-2 border-cyan-500/50 neon-glow-cyan shadow-2xl flex items-center justify-center cursor-pointer">
            
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Start / Game Over Overlay -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center z-10 transition-all duration-300">
                <div id="overlay-title" class="text-2xl sm:text-4xl font-arcade font-black text-cyan-400 mb-2 neon-text-cyan">
                    GRAVITY THIEF
                </div>
                <p id="overlay-desc" class="text-slate-300 text-xs sm:text-sm mb-4 max-w-xs leading-relaxed">
                    Undvik röda laserhinder genom att skifta tyngdkraften mellan golv och tak!
                </p>

                <button id="start-btn" onclick="startGame()" class="btn-arcade w-full max-w-xs py-3 px-6 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-arcade font-black text-base rounded-xl shadow-lg border border-cyan-300 cursor-pointer tracking-wider">
                    STARTA SPRANGET
                </button>
            </div>
        </div>

    </div>

    <!-- SPEL-LOGIK -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 450;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const GROUND_Y = 380;
        const CEILING_Y = 70;
        const PLAYER_SIZE = 28;

        let isRunning = false;
        let isGameOver = false;
        let score = 0;
        let gems = parseInt(localStorage.getItem('gt_gems')) || 0;
        let highScore = parseInt(localStorage.getItem('gt_highscore')) || 0;
        let gameSpeed = 5;
        let isMuted = false;

        // Spelaren
        let player = {
            x: 80,
            y: GROUND_Y - PLAYER_SIZE,
            targetY: GROUND_Y - PLAYER_SIZE,
            vy: 0,
            isGravityInverted: false, // false = golv, true = tak
            trail: []
        };

        // Objekt & Hinder
        let obstacles = [];
        let gemItems = [];
        let particles = [];
        let spawnTimer = 0;

        document.getElementById('high-score').textContent = `${highScore}m`;
        document.getElementById('gems').textContent = gems;

        // Ljudsystem (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(player.isGravityInverted ? 300 : 500, now);
                osc.frequency.exponentialRampToValueAtTime(player.isGravityInverted ? 600 : 250, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'gem') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(900, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('sound-icon').className = isMuted 
                ? 'fa-solid fa-volume-xmark text-slate-500 pointer-events-none' 
                : 'fa-solid fa-volume-high text-cyan-400 pointer-events-none';
        }

        function flipGravity() {
            if (!isRunning || isGameOver) return;
            initAudio();
            player.isGravityInverted = !player.isGravityInverted;
            playSound('flip');

            // Skapa partiklar vid vändning
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: player.x + PLAYER_SIZE / 2,
                    y: player.y + PLAYER_SIZE / 2,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    size: Math.random() * 4 + 2,
                    color: '#22d3ee',
                    life: 1
                });
            }
        }

        function startGame() {
            initAudio();
            isRunning = true;
            isGameOver = false;
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            gemItems = [];
            particles = [];
            spawnTimer = 0;

            player.isGravityInverted = false;
            player.y = GROUND_Y - PLAYER_SIZE;
            player.vy = 0;
            player.trail = [];

            document.getElementById('score').textContent = '0m';
            document.getElementById('overlay').classList.add('hidden');

            requestAnimationFrame(gameLoop);
        }

        function spawnObstacleOrGem() {
            spawnTimer++;
            if (spawnTimer > Math.max(35, 70 - Math.floor(score / 50))) {
                spawnTimer = 0;

                const isCeiling = Math.random() < 0.5;
                const type = Math.random();

                if (type < 0.7) {
                    // Skapa hinder
                    const h = Math.random() * 40 + 40;
                    obstacles.push({
                        x: CANVAS_WIDTH + 20,
                        y: isCeiling ? CEILING_Y : GROUND_Y - h,
                        w: 24,
                        h: h,
                        isCeiling: isCeiling
                    });
                } else {
                    // Skapa Ädelsten
                    gemItems.push({
                        x: CANVAS_WIDTH + 20,
                        y: isCeiling ? CEILING_Y + 15 : GROUND_Y - 35,
                        size: 16
                    });
                }
            }
        }

        function update() {
            if (!isRunning || isGameOver) return;

            score += 0.2;
            document.getElementById('score').textContent = `${Math.floor(score)}m`;

            // Öka hastigheten gradvis
            if (gameSpeed < 13) gameSpeed += 0.0015;

            // Spelarens Tyngdkraft & Rörelse
            const targetY = player.isGravityInverted ? CEILING_Y : GROUND_Y - PLAYER_SIZE;
            player.y += (targetY - player.y) * 0.22;

            // Trail-effekt
            player.trail.unshift({ x: player.x, y: player.y });
            if (player.trail.length > 5) player.trail.pop();

            // Hantera Partiklar
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            }

            spawnObstacleOrGem();

            // Uppdatera Hinder
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Kollision med spelaren
                if (
                    player.x < obs.x + obs.w &&
                    player.x + PLAYER_SIZE > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.y + PLAYER_SIZE > obs.y
                ) {
                    gameOver();
                    return;
                }

                if (obs.x + obs.w < -20) obstacles.splice(i, 1);
            }

            // Uppdatera Skatter
            for (let i = gemItems.length - 1; i >= 0; i--) {
                let gem = gemItems[i];
                gem.x -= gameSpeed;

                // Plocka upp ädelsten
                if (
                    player.x < gem.x + gem.size &&
                    player.x + PLAYER_SIZE > gem.x &&
                    player.y < gem.y + gem.size &&
                    player.y + PLAYER_SIZE > gem.y
                ) {
                    gems += 1;
                    localStorage.setItem('gt_gems', gems);
                    document.getElementById('gems').textContent = gems;
                    playSound('gem');

                    // Guldpartiklar
                    for (let j = 0; j < 8; j++) {
                        particles.push({
                            x: gem.x,
                            y: gem.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            size: 3,
                            color: '#facc15',
                            life: 1
                        });
                    }

                    gemItems.splice(i, 1);
                } else if (gem.x < -20) {
                    gemItems.splice(i, 1);
                }
            }
        }

        function draw() {
            // Bakgrund
            ctx.fillStyle = '#080911';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Rita Tak & Golv med Neon-glöd
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CEILING_Y);
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 10;

            // Golvlinje
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();

            // Taklinje
            ctx.beginPath();
            ctx.moveTo(0, CEILING_Y);
            ctx.lineTo(CANVAS_WIDTH, CEILING_Y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Rita Partiklar
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;

            // Rita Trail
            player.trail.forEach((t, index) => {
                ctx.fillStyle = `rgba(34, 211, 238, ${0.4 - index * 0.08})`;
                ctx.fillRect(t.x, t.y, PLAYER_SIZE, PLAYER_SIZE);
            });

            // Rita Spelaren (Neon-kub med inre kärna)
            ctx.fillStyle = '#ec4899';
            ctx.shadowColor = '#ec4899';
            ctx.shadowBlur = 12;
            ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 6, player.y + 6, PLAYER_SIZE - 12, PLAYER_SIZE - 12);

            // Rita Hinder (Röda Lasrar)
            obstacles.forEach(obs => {
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 12;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.shadowBlur = 0;

                // Laser-mönster i mitten
                ctx.fillStyle = '#fca5a5';
                ctx.fillRect(obs.x + 4, obs.y, obs.w - 8, obs.h);
            });

            // Rita Skatter (Gula diamanter)
            gemItems.forEach(gem => {
                ctx.fillStyle = '#facc15';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(gem.x + gem.size / 2, gem.y);
                ctx.lineTo(gem.x + gem.size, gem.y + gem.size / 2);
                ctx.lineTo(gem.x + gem.size / 2, gem.y + gem.size);
                ctx.lineTo(gem.x, gem.y + gem.size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function gameOver() {
            isGameOver = true;
            isRunning = false;
            playSound('hit');

            const finalScore = Math.floor(score);
            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem('gt_highscore', highScore);
                document.getElementById('high-score').textContent = `${highScore}m`;
            }

            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-title').textContent = 'GAME OVER';
            document.getElementById('overlay-title').className = 'text-2xl sm:text-4xl font-arcade font-black text-pink-500 mb-2 neon-text-pink';
            document.getElementById('overlay-desc').textContent = `Du sprang ${finalScore} meter och samlade ${gems} ädelstenar!`;
            document.getElementById('start-btn').textContent = 'SPELA IGEN';
            overlay.classList.remove('hidden');
        }

        function gameLoop() {
            update();
            draw();
            if (isRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Event-lyssnare
        const gameContainer = document.getElementById('game-container');
        gameContainer.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            flipGravity();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                flipGravity();
            }
        });

        // Rita första bildrutan
        draw();
    </script>
</body>
</html>
